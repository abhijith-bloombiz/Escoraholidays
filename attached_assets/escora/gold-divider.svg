<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 24" fill="none" width="100%" height="24">
  <defs>
    <linearGradient id="escoraGoldLineLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c29d59" stop-opacity="0" />
      <stop offset="60%" stop-color="#b8934f" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9c7a3c" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="escoraGoldLineRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9c7a3c" stop-opacity="1" />
      <stop offset="40%" stop-color="#b8934f" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c29d59" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="escoraGoldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8ba78" />
      <stop offset="50%" stop-color="#b8934f" />
      <stop offset="100%" stop-color="#8c6a2d" />
    </linearGradient>
  </defs>
  <!-- Left hairline -->
  <line x1="20" y1="12" x2="260" y2="12" stroke="url(#escoraGoldLineLeft)" stroke-width="1" />
  <!-- Right hairline -->
  <line x1="340" y1="12" x2="580" y2="12" stroke="url(#escoraGoldLineRight)" stroke-width="1" />
  <!-- Left accent dots -->
  <circle cx="270" cy="12" r="1.5" fill="#b8934f" />
  <circle cx="280" cy="12" r="2" fill="#9c7a3c" />
  <!-- Center Botanical Diamond Crest -->
  <g transform="translate(300, 12)">
    <path d="M 0 -8 C 1.5 -3 3 -1.5 8 0 C 3 1.5 1.5 3 0 8 C -1.5 3 -3 1.5 -8 0 C -3 -1.5 -1.5 -3 0 -8 Z" fill="url(#escoraGoldFill)" />
    <circle cx="0" cy="0" r="1.2" fill="#fff3d9" />
  </g>
  <!-- Right accent dots -->
  <circle cx="320" cy="12" r="2" fill="#9c7a3c" />
  <circle cx="330" cy="12" r="1.5" fill="#b8934f" />
</svg>