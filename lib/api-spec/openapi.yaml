        title:
          type: string
        category:
          type: string
        tagline:
          type: string
        duration:
          type: string
        intensity:
          type: string
        bestTime:
          type: string
        vibe:
          type: string
        heroImage:
          type: string
        gallery:
          type: array
          items:
            type: string
        story:
          type: string
        highlights:
          type: array
          items:
            type: string
        inclusions:
          type: array
          items:
            type: string
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/ExperienceDestination"
        conciergeTip:
          type: string
        featured:
          type: boolean
        published:
          type: boolean
        sortOrder:
          type: integer

    ExperienceUpdate:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        category:
          type: string
        tagline:
          type: string
        duration:
          type: string
        intensity:
          type: string
        bestTime:
          type: string
        vibe:
          type: string
