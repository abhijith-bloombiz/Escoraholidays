          schema:
            type: string
        - in: query
          name: published
          schema:
            type: boolean
        - in: query
          name: featured
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Package"
    post:
      operationId: createPackage
      summary: Create a package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"

  /packages/{id}:
    get:
      operationId: getPackage
      summary: Get package by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"
        "404":
          description: Not found
    patch:
      operationId: updatePackage
      summary: Update a package
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"
    delete:
      operationId: deletePackage
      summary: Delete a package
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Itineraries ───────────────────────────────────────────────
  /itineraries:
    get:
      operationId: listItineraries
      summary: List all itineraries
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: enquiryId
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Itinerary"
    post:
      operationId: createItinerary
      summary: Create an itinerary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Itinerary"

  /itineraries/share/{token}:
    get:
      operationId: getItineraryByShareToken
      summary: Get itinerary by public share token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Itinerary"
        "404":
          description: Not found

  /itineraries/{id}:
    get:
      operationId: getItinerary
      summary: Get itinerary by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Itinerary"
        "404":
          description: Not found
    patch:
      operationId: updateItinerary
      summary: Update an itinerary
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Itinerary"
    delete:
      operationId: deleteItinerary
      summary: Delete an itinerary
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /itineraries/ai-assist:
    post:
      operationId: assistItinerary
      summary: AI Itinerary Assistant — Generate or refine day-by-day slow-luxury proposal draft grounded in Escora catalogue
      tags:
        - Itineraries
        - AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryAiAssistInput"
      responses:
        "200":
          description: AI-assisted itinerary draft proposal with verified catalogue grounding and confirmation flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryAiAssistResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Provider generation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI service unconfigured or offline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Itinerary Templates ───────────────────────────────────────
  /itinerary-templates:
    get:
      operationId: listItineraryTemplates
      summary: List all itinerary templates
      tags:
        - Itineraries
      parameters:
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItineraryTemplate"
    post:
      operationId: createItineraryTemplate
      summary: Create an itinerary template
      tags:
        - Itineraries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryTemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryTemplate"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /itinerary-templates/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      operationId: getItineraryTemplate
      summary: Get an itinerary template by ID
      tags:
        - Itineraries
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryTemplate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateItineraryTemplate
      summary: Update an itinerary template
      tags:
        - Itineraries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryTemplateUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryTemplate"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteItineraryTemplate
      summary: Delete or archive an itinerary template
      tags:
        - Itineraries
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete referenced template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /travel-categories:
    get:
      operationId: listTravelCategories
      summary: List all travel categories
      parameters:
        - in: query
          name: published
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TravelCategory"
    post:
      operationId: createTravelCategory
      summary: Create a travel category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelCategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelCategory"

  /travel-categories/{id}:
    get:
      operationId: getTravelCategory
      summary: Get travel category by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelCategory"
        "404":
          description: Not found
    patch:
      operationId: updateTravelCategory
      summary: Update a travel category
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelCategoryUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelCategory"
    delete:
      operationId: deleteTravelCategory
      summary: Delete a travel category
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Testimonials ─────────────────────────────────────────────
  /testimonials:
    get:
      operationId: listTestimonials
      summary: List all testimonials
      parameters:
        - in: query
          name: published
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
