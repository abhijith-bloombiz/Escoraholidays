components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    DetailedHealthStatus:
      type: object
      required: [status, database, uptimeSeconds, timestamp]
      properties:
        status:
          type: string
        database:
          type: string
        uptimeSeconds:
          type: integer
        timestamp:
          type: string

    # ── Authentication ───────────────────────────────────────────
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResult:
      type: object
      required: [ok, username]
      properties:
        ok:
          type: boolean
        username:
          type: string

    LogoutResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    AuthMeResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        username:
          type: ["string", "null"]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Experience ───────────────────────────────────────────────
    ExperienceDestination:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string

    Experience:
      type: object
      required: [id, title, slug, category, published, createdAt, updatedAt]
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        category:
          type: string
        tagline:
          type: ["string", "null"]
        duration:
          type: ["string", "null"]
        intensity:
          type: ["string", "null"]
        bestTime:
          type: ["string", "null"]
        vibe:
          type: ["string", "null"]
        heroImage:
          type: ["string", "null"]
        gallery:
          type: array
          items:
            type: string
        story:
          type: ["string", "null"]
        highlights:
          type: array
          items:
            type: string
        inclusions:
          type: array
          items:
            type: string
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/ExperienceDestination"
        conciergeTip:
          type: ["string", "null"]
        featured:
          type: boolean
        published:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    ExperienceInput:
      type: object
