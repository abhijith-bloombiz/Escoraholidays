services:
  - type: web
    name: escoraholidays
    runtime: node
    plan: starter
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm run build:prod
    startCommand: pnpm run db:init && pnpm run db:seed && node --enable-source-maps ./apps/api-server/dist/index.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: EMAIL_FROM
        value: Escora Journeys <hello@escoraholidays.com>
